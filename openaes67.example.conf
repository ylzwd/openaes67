# OpenAES67 settings file -- loaded with: openaes67 <command> --config openaes67.conf
#
# Command-line flags are applied after this file, so a flag always wins.
# An unknown key is a startup error, not a silent no-op: a typo in a file that
# starts a service is worth failing on.

# --- network ---------------------------------------------------------------
# The NIC that carries AES67. Must be the real address of a wired interface.
iface      = 192.168.1.10

# Downlink stream: what the ASIO inputs receive.
group      = 239.69.8.8
port       = 5110

# --- format ----------------------------------------------------------------
channels    = 64
sample_rate = 48000
ptime       = 5          # ms per packet; 64 ch @ 5 ms is 30720 B (fragmented)
codec       = l16        # l16 or l24
ttl         = 32

# --- sound-card mode (bridge) ---------------------------------------------
shm         = OpenAES67Audio   # section the ASIO driver attaches to
send_group  = 239.69.9.9       # uplink: ASIO outputs -> network
send_port   = 5090
seconds     = 0                # 0 = run until stopped

# --- discovery -------------------------------------------------------------
# discover      = 1            # find the downlink over SAP instead of group/port
# discover_name = Dante        # only accept names containing this
# sap           = 1            # announce our own uplink
# sap_interval  = 30

# --- clock -----------------------------------------------------------------
ptp        = 1            # feed the PTP rate estimate to the receiver
ptp_domain = 0
# ptp_lock = 1            # derive RTP timestamps from the grandmaster (send)
# refclk   = ptp:00-1D-C1-FF-FE-50-36-33:0

# --- capture (rx) ----------------------------------------------------------
# out      = rx.wav
# out_bits = 24
