name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build-windows:
    name: build + self-test (windows)
    # Pinned on purpose: "windows-latest" moved to an image where the
    # "Visual Studio 17 2022" generator is not found, which failed the configure
    # step with "could not find any instance of Visual Studio".
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: Self-test
        run: .\build\Release\openaes67_selftest.exe

      # The sound card is the reason most people are here, and it needs only the
      # MSVC toolset (the script finds vcvars itself). Building it in CI means the
      # release archive can contain it, instead of asking every user to install a
      # compiler before they can hear anything.
      - name: Build the 64x64 ASIO sound card
        shell: pwsh
        run: .\asio_driver\build-asio-driver.bat

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: openaes67-win64
          path: |
            build/Release/openaes67.exe
            build/Release/openaes67_selftest.exe
          if-no-files-found: error

      - name: Upload ASIO sound card
        uses: actions/upload-artifact@v4
        with:
          name: openaes67-asio64
          path: |
            asio_driver/out/openaes67_asio64.dll
            asio_driver/register-asio-driver.bat
            asio_driver/unregister-asio-driver.bat
          if-no-files-found: error

  policy:
    name: policy checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # The project is deliberately free of vendor identifiers, licence checks
      # and telemetry. Enforce it rather than trusting reviewers to notice.
      - name: No vendor identifiers in sources
        shell: pwsh
        run: |
          # Scan the code and docs, not this workflow (which necessarily
          # contains the pattern itself).
          $hits = Get-ChildItem src,include,tools,tests,docs -Recurse -File -Include *.cpp,*.h,*.py,*.md,*.ps1 |
                  Select-String -Pattern 'VSC' -CaseSensitive
          if ($hits) {
            $hits | ForEach-Object { Write-Host "::error file=$($_.Path),line=$($_.LineNumber)::$($_.Line.Trim())" }
            exit 1
          }
          Write-Host "no vendor identifiers found"

      - name: No licensing or activation logic
        shell: pwsh
        run: |
          # Deliberately narrow. The first version of this check also matched
          # "register" and "serial", which flagged `PcRegisterSubdevice` in the
          # PortCls driver and the "register the class" comment in the ASIO host
          # test -- legitimate code, red build. What must not exist is licensing
          # *logic*: a key check, a trial timer, a phone-home to a licence server.
          $patterns = 'licen[cs]e[ _-]?key|activation[ _-]?code|product[ _-]?key|' +
                      'serial[ _-]?number|trial[ _-]?expired|validation[ _-]?server'
          $hits = Get-ChildItem -Recurse -File -Include *.cpp,*.h |
                  Select-String -Pattern $patterns -CaseSensitive:$false |
                  Where-Object { $_.Line -notmatch 'SPDX|LICENSE file|MIT|licence|license\.' }
          if ($hits) {
            $hits | ForEach-Object { Write-Host "::error file=$($_.Path),line=$($_.LineNumber)::$($_.Line.Trim())" }
            exit 1
          }
          Write-Host "no licensing logic found"

      - name: Python tools parse
        shell: pwsh
        run: |
          python -m py_compile tools/aes67_tx.py tools/aes67_rx.py tools/ptp_master.py
          Write-Host "python tools parse"
  gui:
    name: gui build (Qt 6, best effort)
    # The GUI needs Qt, which costs a few minutes to install and a 12 MB runtime to
    # ship. It is built separately so the CLI archive stays small, and a failure
    # here must not sink the release: the CLI and the sound card are the parts that
    # make audio work.
    continue-on-error: true
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          cache: true

      - name: Configure
        run: cmake -S . -B build-gui -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build-gui --config Release --target openaes67_gui

      - name: Collect the Qt runtime
        shell: pwsh
        run: |
          $pkg = "build-gui/gui-package"
          New-Item -ItemType Directory -Path $pkg -Force | Out-Null
          Copy-Item build-gui/Release/openaes67_gui.exe $pkg
          & windeployqt --release --no-translations --no-system-d3d-compiler `
                        --no-opengl-sw --compiler-runtime "$pkg/openaes67_gui.exe"
          if (-not (Test-Path "$pkg/platforms/qwindows.dll")) {
            throw "windeployqt did not produce the platform plugin"
          }
          # windeployqt copies the binaries but not their licence text, and Qt is
          # LGPL: redistributing it means shipping its licence. The binary kit
          # that aqtinstall fetches does not carry the LICENSES directory at
          # all, so it is taken from the Qt sources of the same version. The
          # kit does ship an SPDX bill of materials, which records which
          # licence applies to which module; that goes in as well.
          $qtRoot = $env:QT_ROOT_DIR
          if (-not $qtRoot) { throw "QT_ROOT_DIR is not set by the Qt install step" }

          $licences = Join-Path $pkg "LICENSES"
          New-Item -ItemType Directory -Path $licences -Force | Out-Null
          $qtVersion = "6.8.3"
          $base = "https://raw.githubusercontent.com/qt/qtbase/v$qtVersion/LICENSES"
          foreach ($f in @('LGPL-3.0-only.txt', 'GPL-3.0-only.txt', 'GPL-2.0-only.txt')) {
            $out = Join-Path $licences $f
            Invoke-WebRequest -Uri "$base/$f" -OutFile $out -UseBasicParsing
            if ((Get-Item $out).Length -lt 1000) { throw "$f came back empty" }
          }
          # The SPDX manifest names the licence for every module in the kit.
          $sbom = Join-Path $qtRoot "sbom"
          if (Test-Path $sbom) {
            Copy-Item $sbom (Join-Path $pkg "QT-SBOM") -Recurse
          }
          Write-Host "  Qt licences: $((Get-ChildItem $licences).Name -join ', ')"

      - name: Upload GUI package
        uses: actions/upload-artifact@v4
        with:
          name: openaes67-gui-win64
          path: build-gui/gui-package/**
          if-no-files-found: error

  driver-build:
    name: driver build (WDK, best effort)
    runs-on: windows-latest
    # The driver needs the WDK, which is not preinstalled on the hosted image and
    # whose installer may refuse a silent install. A failure here must not turn
    # the whole workflow red: the user-mode project is the shippable part.
    #
    # The individual steps are continue-on-error as well: the job-level flag kept
    # the run green but still painted the job red, and a red job that nobody is
    # supposed to act on trains people to ignore red. Skipping with a warning is
    # the honest signal.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install WDK 10.0.26100
        id: wdk
        continue-on-error: true
        shell: pwsh
        run: |
          winget install --id Microsoft.WindowsWDK.10.0.26100 -e --silent `
            --disable-interactivity --accept-package-agreements --accept-source-agreements

      - name: Build driver
        id: driver
        if: steps.wdk.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: .\driver\build-driver.bat

      - name: Report driver result
        shell: pwsh
        run: |
          $wdk = '${{ steps.wdk.outcome }}'
          $build = '${{ steps.driver.outcome }}'
          if ($wdk -ne 'success') {
            Write-Host "::warning::WDK unavailable on this runner; driver build skipped (user-mode project is unaffected)"
          } elseif ($build -ne 'success') {
            Write-Host "::warning::driver build failed on this runner; best effort, not a release blocker"
          } else {
            Write-Host "driver built"
          }

      - name: Upload driver package
        uses: actions/upload-artifact@v4
        with:
          name: openaes67-driver
          path: driver/out/audio/**
          if-no-files-found: warn
